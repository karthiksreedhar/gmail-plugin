<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Response Template Mining Runs</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f5f7; color: #1f2430; font-size: 14px; }
  .layout { display: flex; height: 100vh; }

  .sidebar { width: 320px; min-width: 320px; background: #fff; border-right: 1px solid #e3e6ea; display: flex; flex-direction: column; }
  .sidebar-head { padding: 14px 16px; border-bottom: 1px solid #e3e6ea; }
  .sidebar-head h1 { font-size: 15px; margin-bottom: 8px; }
  .sidebar-head select { width: 100%; padding: 6px 8px; border: 1px solid #d0d5dd; border-radius: 6px; font-size: 13px; }
  .run-list { overflow-y: auto; flex: 1; }
  .run-item { padding: 10px 14px; border-bottom: 1px solid #eef0f3; cursor: pointer; }
  .run-item:hover { background: #f6f8fb; }
  .run-item.active { background: #eef4ff; border-left: 3px solid #4285f4; padding-left: 11px; }
  .run-item .line1 { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }
  .run-item .right-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .trash-btn { border: none; background: none; cursor: pointer; color: #98a2b3; padding: 2px 3px; border-radius: 4px; line-height: 0; }
  .trash-btn:hover { color: #d92d20; background: #fef3f2; }
  .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; display: flex; align-items: center; justify-content: center; }
  .confirm-box { background: #fff; border-radius: 10px; padding: 20px 22px; max-width: 380px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .confirm-box h3 { font-size: 15px; margin-bottom: 8px; }
  .confirm-box p { color: #475467; font-size: 13px; margin-bottom: 16px; }
  .confirm-box .btns { display: flex; justify-content: flex-end; gap: 8px; }
  .confirm-box button { padding: 7px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .confirm-box .cancel { border: 1px solid #d0d5dd; background: #fff; }
  .confirm-box .delete { border: none; background: #d92d20; color: #fff; }
  .run-item .when { font-weight: 600; font-size: 13px; }
  .run-item .who { color: #667085; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-item .nums { color: #667085; font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 600; color: #fff; }
  .badge.ok { background: #17a278; }
  .badge.fail { background: #d92d20; }

  .main { flex: 1; overflow-y: auto; padding: 20px 26px; }
  .empty { color: #667085; padding: 60px; text-align: center; }
  .section { background: #fff; border: 1px solid #e3e6ea; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #667085; margin-bottom: 12px; }
  .meta-grid { display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 13px; }
  .meta-grid .kv b { display: block; color: #667085; font-weight: 500; font-size: 11px; text-transform: uppercase; }
  .fail-banner { background: #fef3f2; border: 1px solid #fda29b; color: #b42318; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-size: 13px; }

  .funnel { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
  .stage { background: #f8fafc; border: 1px solid #e3e6ea; border-radius: 8px; padding: 10px 14px; min-width: 108px; }
  .stage .n { font-size: 22px; font-weight: 700; }
  .stage .l { font-size: 11px; color: #667085; margin-top: 2px; }
  .stage .d { font-size: 11px; color: #b42318; margin-top: 2px; }
  .arrow { align-self: center; color: #98a2b3; font-size: 16px; padding: 0 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #667085; font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 2px solid #e3e6ea; white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  tr:hover td { background: #f9fafb; }
  .muted { color: #98a2b3; }

  .cluster-card { border: 1px solid #e3e6ea; border-left: 4px solid #4285f4; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .cluster-card.dead { border-left-color: #d92d20; background: #fffbfa; }
  .cluster-card .name { font-weight: 600; }
  .cluster-card .counts { font-size: 12.5px; color: #475467; margin-top: 2px; }
  .cluster-card .counts .survived { color: #027a48; font-weight: 600; }
  .cluster-card .counts .killed { color: #b42318; font-weight: 600; }
  .removed-item { background: #fef3f2; border-radius: 6px; padding: 6px 9px; margin-top: 6px; font-size: 12.5px; }
  .removed-item .rid { font-family: ui-monospace, monospace; font-size: 11px; color: #98a2b3; }

  .tpl-card { border: 1px solid #e3e6ea; border-left: 4px solid #17a278; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .tpl-card .name { font-weight: 600; }
  .tpl-card .when-use { color: #475467; font-size: 13px; margin-top: 2px; }
  .tpl-card .members { color: #667085; font-size: 12px; margin-top: 4px; }
  .err-item { background: #fef3f2; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 12.5px; color: #b42318; }
</style>
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-head">
      <h1>Response Template Mining Runs</h1>
      <select id="userFilter"><option value="">All users</option></select>
    </div>
    <div class="run-list" id="runList"><div class="empty">Loading…</div></div>
  </div>
  <div class="main" id="main"><div class="empty">Select a run on the left.</div></div>
</div>

<script>
let allRuns = [];
let activeRunId = null;

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function fmtWhen(iso) {
  if (!iso) return '?';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function fmtDur(ms) {
  if (ms == null) return '?';
  return ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(1) + 's';
}

async function loadRuns() {
  const resp = await fetch('/api/debug/template-suggestion-runs?limit=100');
  const data = await resp.json();
  allRuns = data.runs || [];
  const users = [...new Set(allRuns.map(r => r.userEmail).filter(Boolean))].sort();
  const sel = document.getElementById('userFilter');
  users.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = u;
    sel.appendChild(opt);
  });
  sel.onchange = renderList;
  renderList();
}

function visibleRuns() {
  const u = document.getElementById('userFilter').value;
  return u ? allRuns.filter(r => r.userEmail === u) : allRuns;
}

function renderList() {
  const el = document.getElementById('runList');
  const runs = visibleRuns();
  if (!runs.length) {
    el.innerHTML = '<div class="empty">No runs recorded yet.<br><br>Runs appear after someone clicks "Surface Response Templates".</div>';
    return;
  }
  el.innerHTML = runs.map(r => {
    const final = (r.final && r.final.templates) ? r.final.templates.length : 0;
    const considered = r.pool ? (r.pool.repliesConsidered ?? '?') : '?';
    return `<div class="run-item ${r.runId === activeRunId ? 'active' : ''}" onclick="selectRun('${esc(r.runId)}')">
      <div class="line1">
        <span class="when">${fmtWhen(r.startedAt)}</span>
        <span class="right-col">
          <span class="badge ${r.ok === false ? 'fail' : 'ok'}">${r.ok === false ? 'failed' : 'ok'}</span>
          <button class="trash-btn" onclick="event.stopPropagation(); confirmDelete('${esc(r.runId)}')" title="Delete this run">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
          </button>
        </span>
      </div>
      <div class="who">${esc(r.userEmail)}</div>
      <div class="nums">${considered} replies &rarr; ${final} template${final === 1 ? '' : 's'} &bull; ${fmtDur(r.durationMs)}</div>
    </div>`;
  }).join('');
}

function confirmDelete(runId) {
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `<div class="confirm-box">
    <h3>Delete this run?</h3>
    <p>The debug record is removed permanently. This does not affect any saved templates.</p>
    <div class="btns"><button class="cancel">Cancel</button><button class="delete">Delete</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  overlay.querySelector('.cancel').onclick = () => overlay.remove();
  overlay.querySelector('.delete').onclick = async () => {
    await fetch('/api/debug/template-suggestion-runs/' + encodeURIComponent(runId), { method: 'DELETE' });
    overlay.remove();
    allRuns = allRuns.filter(r => r.runId !== runId);
    if (activeRunId === runId) { activeRunId = null; document.getElementById('main').innerHTML = '<div class="empty">Select a run on the left.</div>'; }
    renderList();
  };
}

function selectRun(runId) {
  activeRunId = runId;
  renderList();
  const r = allRuns.find(x => x.runId === runId);
  if (r) renderDetail(r);
}

function stage(n, label, dropNote) {
  return `<div class="stage"><div class="n">${n}</div><div class="l">${esc(label)}</div>${dropNote ? `<div class="d">${esc(dropNote)}</div>` : ''}</div>`;
}

function renderDetail(r) {
  const main = document.getElementById('main');
  const pool = r.pool || {};
  const clustering = r.clustering || {};
  const verification = r.verification || null;
  const drafting = r.drafting || {};
  const finalTemplates = (r.final && r.final.templates) || [];

  const kept = clustering.kept || [];
  const verifClusters = (verification && verification.clusters) || [];
  const survivors = verifClusters.filter(c => !((verification.droppedBelowMin || []).includes(c.name))).length;

  let html = '';
  if (r.ok === false) {
    html += `<div class="fail-banner"><b>Run failed:</b> ${esc(r.failure || 'unknown error')}</div>`;
  }

  html += `<div class="section"><h2>Run</h2><div class="meta-grid">
    <div class="kv"><b>User</b>${esc(r.userEmail)}</div>
    <div class="kv"><b>When</b>${fmtWhen(r.startedAt)}</div>
    <div class="kv"><b>Duration</b>${fmtDur(r.durationMs)}</div>
    <div class="kv"><b>Model</b>${esc(r.model || '?')}</div>
    <div class="kv"><b>API calls</b>${r.apiCalls ? `${r.apiCalls.count} (${r.apiCalls.failed} failed)` : '?'}</div>
    <div class="kv"><b>Run id</b>${esc(r.runId)}</div>
  </div></div>`;

  // Funnel: sent fetch -> filtered -> pool -> clusters -> verified -> templates
  const funnelParts = [];
  if (pool.sentMailFetched != null) {
    funnelParts.push(stage(pool.sentMailFetched, 'sent mail fetched'));
    funnelParts.push('<div class="arrow">&rarr;</div>');
    funnelParts.push(stage(pool.repliesConsidered ?? '?', 'replies in pool', pool.automatedFiltered ? `${pool.automatedFiltered} automated filtered` : null));
  } else {
    funnelParts.push(stage(pool.repliesConsidered ?? '?', 'replies in pool'));
  }
  funnelParts.push('<div class="arrow">&rarr;</div>');
  funnelParts.push(stage(kept.length, 'clusters kept', (clustering.dropped || []).length ? `${(clustering.dropped || []).length} dropped (too small)` : null));
  if (verification) {
    funnelParts.push('<div class="arrow">&rarr;</div>');
    funnelParts.push(stage(survivors, 'survived verification', (verification.droppedBelowMin || []).length ? `${(verification.droppedBelowMin || []).length} pruned below min` : null));
  }
  funnelParts.push('<div class="arrow">&rarr;</div>');
  funnelParts.push(stage(finalTemplates.length, 'templates drafted', drafting.failures && drafting.failures.length ? `${drafting.failures.length} draft failures` : null));
  html += `<div class="section"><h2>Funnel</h2><div class="funnel">${funnelParts.join('')}</div>`;
  if (pool.bySource) {
    html += `<p style="margin-top:10px;font-size:12.5px;color:#667085;">Pool sources: ${Object.entries(pool.bySource).map(([k, v]) => `${esc(k)}: ${v}`).join(' &bull; ')} &bull; caps: ${pool.maxReplies ?? '?'} replies, min ${pool.minRepliesPerTemplate ?? '?'} per template, min ${pool.minReplyWords ?? '?'} words</p>`;
  }
  html += '</div>';

  // Clustering
  html += `<div class="section"><h2>Clustering (${clustering.proposed ?? '?'} proposed)</h2>`;
  if (!kept.length && !(clustering.dropped || []).length) {
    html += '<p class="muted">No clusters recorded.</p>';
  } else {
    html += '<table><tr><th>Cluster</th><th>Members</th><th>Outcome</th></tr>';
    kept.forEach(c => { html += `<tr><td>${esc(c.name)}</td><td>${c.members}</td><td>kept &rarr; verification</td></tr>`; });
    (clustering.dropped || []).forEach(c => { html += `<tr><td class="muted">${esc(c.name)}</td><td class="muted">${c.validMembers}</td><td class="muted">dropped (below minimum)</td></tr>`; });
    html += '</table>';
  }
  html += '</div>';

  // Verification: the heart of the page -- what got pruned and why
  if (verification) {
    html += `<div class="section"><h2>Verification (full-text membership check)</h2>`;
    if (!verifClusters.length) {
      html += '<p class="muted">No verification data recorded.</p>';
    } else {
      verifClusters.forEach(c => {
        const dead = (verification.droppedBelowMin || []).includes(c.name);
        html += `<div class="cluster-card ${dead ? 'dead' : ''}">
          <div class="name">${esc(c.name)}</div>
          <div class="counts">${c.before} member${c.before === 1 ? '' : 's'} &rarr; ${c.after} verified &bull; ${dead
            ? '<span class="killed">discarded (below minimum after pruning)</span>'
            : '<span class="survived">survived &rarr; drafted</span>'}${c.verified === false ? ' <span class="muted">(verification call failed; kept unpruned)</span>' : ''}</div>
          ${(c.removed || []).map(m => `<div class="removed-item"><span class="rid">${esc(m.id)}</span> — ${esc(m.reason)}</div>`).join('')}
        </div>`;
      });
    }
    html += '</div>';
  }

  // Final templates
  html += `<div class="section"><h2>Templates produced (${finalTemplates.length})</h2>`;
  if (!finalTemplates.length) {
    html += `<p class="muted">${esc((r.final && r.final.note) || 'None.')}</p>`;
  } else {
    finalTemplates.forEach(t => {
      html += `<div class="tpl-card">
        <div class="name">${esc(t.name)}</div>
        <div class="when-use">${esc(t.whenToUse || '')}</div>
        <div class="members">${t.members} verified example repl${t.members === 1 ? 'y' : 'ies'}${t.category ? ` &bull; category: ${esc(t.category)}` : ''}</div>
      </div>`;
    });
  }
  html += '</div>';

  // Errors
  if ((r.errors || []).length) {
    html += `<div class="section"><h2>Errors (${r.errors.length})</h2>${r.errors.map(e =>
      `<div class="err-item"><b>${esc(e.context || e.label || '')}</b> ${esc(e.message || e.error || JSON.stringify(e))}</div>`).join('')}</div>`;
  }

  main.innerHTML = html;
}

loadRuns();
</script>
</body>
</html>
